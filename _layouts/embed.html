<!doctype html>
<html lang="en">
  <head>
    {% include head.html %}
    <style>
      /* ---------- embed layout ----------
         Renders a standalone page inside an iframe that fills the exact
         area between the site nav and footer. The wrapper itself never
         scrolls (height locked to the viewport), so the only scrollbar
         on screen is the embedded page's own. */

      html { height: 100%; }

      body.embed {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        margin: 0;
        overflow: hidden;
      }

      /* the site grain overlay would tint the embedded page's own theme */
      body.embed::after { display: none; }

      /* theme-boundary hairlines move onto the frame region, so there is
         exactly one line at each seam (site chrome / embedded theme) */
      body.embed nav { position: static; border-bottom: 0; }
      body.embed footer { margin-top: 0; border-top: 0; }

      .embed-frame-wrap {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
      }

      .embed-frame {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }
    </style>
  </head>
  <body class="embed">
    {% include nav.html %}
    <div class="embed-frame-wrap">
      <iframe
        class="embed-frame"
        src="{{ page.iframe_src }}"
        title="{{ page.title | default: 'Embedded page' }}"
        loading="eager"
      ></iframe>
    </div>
    {% include footer.html %}
  </body>
</html>
